spring.application.name=schoolbuddy-backend

# ============================================================
# SERVER
# ============================================================

server.port=${PORT:8080}


# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/schoolbuddy}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ============================================================
# SARVAM AI
# ============================================================

sarvam.api.key=${SARVAM_API_KEY:}
sarvam.api.url=https://api.sarvam.ai/v2/chat/completions
sarvam.api.model=gemma4


# ============================================================
# GEMINI AI
# ============================================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta

gemini.models=gemini-3.8-flash,gemini-3.7-flash,gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite

# ============================================================
# FRONTEND / CORS
# ============================================================

app.frontend-url=${FRONTEND_URL:http://localhost:3000}


# ============================================================
# AI PROVIDER
# ============================================================

# ============================================================
# OPENAI
# ============================================================

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.api.model=gpt-5-mini


# ============================================================
# OPENROUTER
# ============================================================

openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.url=https://openrouter.ai/api/v1/chat/completions
openrouter.api.model=openai/gpt-5-mini