spring.application.name=schoolbuddy-backend

server.port=8080

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:schoolbuddy}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:2004}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View
spring.jpa.open-in-view=false

# ============================================================
# SARVAM AI
# ============================================================

sarvam.api.key=${SARVAM_API_KEY:}
sarvam.api.url=https://api.sarvam.ai/v2/chat/completions
sarvam.api.model=gemma4

# ============================================================
# GEMINI AI
# ============================================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta
gemini.api.model=gemini-3.8-flash

# ============================================================
# AI PROVIDER
# ============================================================

# Available values:
# mock   = local development/testing
# gemini = real Gemini multimodal AI
ai.provider=mock

# ============================================================
# FRONTEND / CORS
# ============================================================

app.frontend-url=${FRONTEND_URL:http://localhost:3000}